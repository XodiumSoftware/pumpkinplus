[package]
name = "pumpkinplus"
version = "0.0.4"
edition = "2024"
authors = ["Xodium"]
description = "Minecraft Pumpkin plugin that enhances the base gameplay"

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = "0.2.1"
minimessage-impl = "0.1.2"
tracing = "0.1.44"
serde = { version = "1.0.229", features = ["derive"] }
config = { version = "0.15.27", default-features = false, features = ["toml"] }
toml = "1.2.1"

[profile.release]
lto = true
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
