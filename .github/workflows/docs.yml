name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1

      - id: setup_rust
        name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@d197c158264056996cfba74a9c2d93886346edc3
        with:
          toolchain: stable
          target: wasm32-wasip3

      - id: setup_pages
        name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - id: cache_dependencies
        name: Cache dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-wasm32-wasip3-cargo-${{ hashFiles('**/Cargo.lock') }}

      - id: build_docs
        name: Build Docs
        run: cargo doc --no-deps --document-private-items --target wasm32-wasip3
        shell: bash

      - id: upload_pages_artifact
        name: Upload Pages Artefact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: target/wasm32-wasip3/doc

  deploy:
    name: Deploy
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.0
