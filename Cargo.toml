[package]
name = "pumpkinplus"
version = "0.0.4"
edition = "2024"
authors = ["Xodium"]
description = "Minecraft Pumpkin plugin that enhances the base gameplay"

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = "0.2.1+26.3-26.51"
minimessage-impl = "0.1.2"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
toml = "1"

[profile.release]
lto = true
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
