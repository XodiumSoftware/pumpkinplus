[package]
name = "pumpkinplus"
version = "0.0.4"
edition = "2024"
authors = ["Xodium"]
description = "Minecraft Pumpkin plugin that enhances the base gameplay"

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = "0.2.0+26.3-26.51"
minimessage-rs = "0.1.6"
minimessage-runtime = { git = "https://github.com/Mettwasser/minimessage-rs" }
tracing = "0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
config = { version = "0.15", default-features = false, features = ["json"] }

[profile.release]
lto = true
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
